[package]
name = "trillium-client-retry"
version = "0.1.0"
edition = "2024"
description = "Automatic retry/backoff middleware for the trillium HTTP client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trillium-rs/trillium-client-retry"
readme = "README.md"
keywords = ["trillium", "client", "retry", "backoff"]
categories = ["web-programming"]

[dependencies]
trillium-client = "0.9.5"
fastrand = "2.3.0"

[dev-dependencies]
trillium-testing = { version = "0.10", features = ["smol"] }
trillium-logger = { version = "0.5.3", features = ["client"] }
async-channel = "2.5.0"
